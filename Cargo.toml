[workspace]
resolver = "2"
members = ["crates/orrery-core", "crates/orrery-server", "crates/orrery"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danieloakman/orrery"

[workspace.dependencies]
orrery-core = { path = "crates/orrery-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
