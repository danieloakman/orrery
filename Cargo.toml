[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-server",
    "crates/sim-rs",
    "crates/sim-ctl",
    "crates/mundus",
    "crates/life",
    "crates/mundus-client",
    "crates/life-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danieloakman/sim-rs"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-server = { path = "crates/sim-server" }
mundus = { path = "crates/mundus" }
life = { path = "crates/life" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
